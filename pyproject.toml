[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmepep"
version = "0.1.0"
description = "De novo design of cosmetic peptides from the skin ECM degradome, scored against permutation nulls"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Apostolos Fysekidis" }]
keywords = ["peptide-design", "cosmetic", "matrikine", "cheminformatics", "skin", "degradome"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = ["numpy>=1.24", "requests>=2.31", "peptides>=0.3", "rdkit>=2023.9"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
cosmepep = "cosmepep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 95
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["^tests/"]

[[tool.mypy.overrides]]
module = ["rdkit.*", "peptides.*"]
ignore_missing_imports = true
follow_imports = "skip"
